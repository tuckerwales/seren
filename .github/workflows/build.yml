name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Sign with the suite's key when the repository has it, so each build installs over the last.
      # Without it (pull requests from forks, say) the runner's throwaway debug key is used.
      - name: Set up signing key
        env:
          SEREN_KEYSTORE_BASE64: ${{ secrets.SEREN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SEREN_KEYSTORE_BASE64" ]; then
            echo "$SEREN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/seren.p12"
            echo "SEREN_KEYSTORE_FILE=$RUNNER_TEMP/seren.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::SEREN_KEYSTORE_BASE64 is not set, so these APKs are signed with a throwaway key and will not install over earlier builds."
          fi

      - name: Build debug and release APKs
        env:
          SEREN_KEYSTORE_PASSWORD: ${{ secrets.SEREN_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload Seren SSH APKs
        uses: actions/upload-artifact@v4
        with:
          name: seren-ssh
          path: |
            ssh/build/outputs/apk/debug/*.apk
            ssh/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Seren Edit APKs
        uses: actions/upload-artifact@v4
        with:
          name: seren-edit
          path: |
            edit/build/outputs/apk/debug/*.apk
            edit/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Seren Auth APKs
        uses: actions/upload-artifact@v4
        with:
          name: seren-auth
          path: |
            auth/build/outputs/apk/debug/*.apk
            auth/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Seren Files APKs
        uses: actions/upload-artifact@v4
        with:
          name: seren-files
          path: |
            files/build/outputs/apk/debug/*.apk
            files/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            */build/reports/tests/
            */build/screenshots/
          if-no-files-found: ignore
