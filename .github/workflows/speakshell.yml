name: SpeakShell companion
on:
  push:
    paths: ['tools/speakshell/**', '.github/workflows/speakshell.yml']
  pull_request:
    paths: ['tools/speakshell/**', '.github/workflows/speakshell.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./tools/speakshell
      - run: python -m unittest discover -s tools/speakshell/tests -v
      - run: speakshell --help
