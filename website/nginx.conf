# Files keep their names between deploys, so nothing is cached as immutable.
# HTML, CSS and JS are revalidated on every load (a cheap 304 when unchanged),
# so a deploy shows up straight away and the pages never pair with an old
# stylesheet. Images can be reused for a day. Pages also link CSS and JS with
# ?v=<hash>, which gets past copies cached under the old rules.
map $uri $seren_cache_control {
    ~^/images/          "public, max-age=86400";
    /favicon.svg        "public, max-age=86400";
    default             "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Set once here; a location with its own add_header would drop these.
    add_header Cache-Control $seren_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Clean URLs for multi-page site (trailing slash → index.html)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Explicit pretty paths
    location = /ssh { return 301 /ssh/; }
    location = /edit { return 301 /edit/; }
    location = /auth { return 301 /auth/; }
    location = /files { return 301 /files/; }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
