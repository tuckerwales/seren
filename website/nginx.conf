server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Security-ish headers (safe for a static marketing site)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Long cache for fingerprinted-not-needed static assets
    location /css/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /js/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Clean URLs for multi-page site (trailing slash → index.html)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Explicit pretty paths
    location = /ssh { return 301 /ssh/; }
    location = /edit { return 301 /edit/; }
    location = /auth { return 301 /auth/; }
    location = /files { return 301 /files/; }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
